<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { height: 100vh; background: #212529; color: white; padding: 20px; }
        .todo-card { border: none; border-radius: 10px; transition: transform 0.2s; }
        .todo-card:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .completed-text { text-decoration: line-through; color: #adb5bd; }
        .priority-high { border-left: 5px solid #dc3545; }
        .priority-medium { border-left: 5px solid #ffc107; }
        .priority-low { border-left: 5px solid #198754; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
            <div class="position-sticky">
                <h4 class="mb-4">TaskCenter</h4>
                <div class="mb-4">
                    <small class="text-uppercase text-muted">User</small>
                    <div class="d-flex align-items-center mt-2">
                        <i class="bi bi-person-circle fs-3 me-2"></i>
                        <span id="userNameDisplay">Admin_User</span>
                    </div>
                </div>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item">
                        <a class="nav-link text-white active" href="#"><i class="bi bi-list-check me-2"></i> 所有任务</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#"><i class="bi bi-star me-2"></i> 紧急事项</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#"><i class="bi bi-calendar-event me-2"></i> 今日计划</a>
                    </li>
                </ul>
                <hr>
                <button class="btn btn-outline-danger btn-sm w-100" onclick="logout()">Logout</button>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">My List</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <span class="badge bg-primary rounded-pill py-2 px-3">Waiting list</span>
                </div>
            </div>

            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <input type="text" id="todoInput" class="form-control" placeholder="New Task">
                        </div>
                        <div class="col-md-3">
                            <select id="prioritySelect" class="form-select">
                                <option value="low">Low</option>
                                <option value="medium" selected>medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-primary w-100" onclick="addTodo()">
                                <i class="bi bi-plus-lg me-1"></i> Add
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="todoContainer" class="row row-cols-1 g-3">
                <div class="col">
                    <div class="card todo-card priority-high shadow-sm">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center">
                                <input class="form-check-input me-3" type="checkbox" style="width: 22px; height: 22px;">
                                <div>
                                    <h6 class="mb-0">完成第二季度财务报表核算</h6>
                                    <small class="text-muted"><i class="bi bi-clock me-1"></i> 截止日期: 2026-04-30</small>
                                </div>
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
