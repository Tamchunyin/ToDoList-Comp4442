<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Dashboard - ToDo System</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Todo System</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3">Welcome, <strong id="currentUserName">Guest</strong></span>
            <a href="/userMangement.html" id="adminBtn" class="btn btn-outline-warning btn-sm me-2" style="display:none;">User Management</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>
<div class="d-flex" id="wrapper">
    <div id="sidebar-wrapper">
        <div class="sidebar-heading p-4 text-white">
            <i class="bi bi-check2-square me-2"></i>
            <span class="full-text fw-bold">ToDoList System</span>
        </div>
        <div class="list-group list-group-flush w-100">
            <a href="index.html" class="list-group-item list-group-item-action bg-white" onclick="loadTodos()">
                <i class="bi bi-house-door"></i>
                <span class="nav-text">Dashboard</span>
            </a>
        </div>
    </div>

    <div id="page-content-wrapper">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-11 col-lg-10"> <div class="card shadow-sm mb-4 border-0">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-3">Create New Task</h5>
                        <div class="row g-3">
                            <div class="col-12">
                                <input type="text" id="todoTitle" class="form-control" placeholder="Task Title">
                            </div>
                            <div class="col-md-6">
                                <input type="text" id="todoInput" class="form-control" placeholder="Description...">
                            </div>
                            <div class="col-md-3">
                                <input type="date" id="todoDate" class="form-control">
                            </div>
                            <div class="col-md-3">
                                <select id="prioritySelect" class="form-select">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                            <div class="col-12 d-flex justify-content-between align-items-center">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="isPublicCheck">
                                    <label class="form-check-label" for="isPublicCheck">Public Access</label>
                                </div>
                                <button class="btn btn-primary px-4" onclick="addTodo()">Add Task</button>
                            </div>
                        </div>
                    </div>
                </div>

                    <h4 class="mb-3">Existing Tasks</h4>
                    <div id="todoList" class="list-group shadow-sm">
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
